# Curatarr Tuning Configuration
# Display options, weights, and scoring parameters
# This file is optional - defaults are used if not present

# =============================================================================
# MOVIE SETTINGS
# =============================================================================
movies:
  # Max recommendations per user - the final recommendation/collection
  # count (see general.limit_plex_results in config.example.yml for the
  # internal candidate-scoring buffer this feeds).
  limit_results: 50
  randomize_recommendations: false  # Randomize from top pool

  # Display options for recommendations output
  show_summary: true
  show_cast: true
  show_director: true
  show_genres: true
  show_language: true
  show_rating: true
  show_imdb_link: true

  # Quality filters - exclude low-quality content
  quality_filters:
    min_rating: 5.0  # TMDB rating minimum (0-10)
    min_vote_count: 15  # Minimum votes for reliability

  # Minimum watched movies before a user gets a Recommended collection
  # at all (#291). Below this, there's too little watch history to
  # build a genuine preference signal from - a "profile" built from a
  # single film is really just "recommend more like that one movie",
  # not a personalized recommendation, so no collection is created
  # (an EXISTING collection from a prior run is left untouched either
  # way, never deleted).
  min_watch_history: 2

  # Scoring weights - must sum to 1.0
  weights:
    genre: 0.25
    director: 0.05
    actor: 0.20
    keyword: 0.50  # TMDB keywords (plot themes, settings)

# =============================================================================
# TV SHOW SETTINGS
# =============================================================================
tv:
  limit_results: 20  # Max recommendations per user
  randomize_recommendations: false
  normalize_counters: true  # Normalize across different show lengths

  # Display options
  show_summary: true
  show_cast: true
  show_language: true
  show_rating: true
  show_imdb_link: true

  # Quality filters
  quality_filters:
    min_rating: 0.0
    min_vote_count: 0

  # Minimum watched shows before a user gets a Recommended collection
  # at all - see movies.min_watch_history above for the full rationale.
  min_watch_history: 2

  # Scoring weights - must sum to 1.0
  weights:
    genre: 0.25
    studio: 0.10  # TV uses studio instead of director
    actor: 0.20
    keyword: 0.45

# =============================================================================
# COLLECTION SETTINGS
# =============================================================================
collections:
  add_label: true  # Add 'Recommended' label to items
  label_name: Recommended
  append_usernames: true  # Include username in collection name

  # Custom collection-name templates (#267) - optional. Placeholders:
  #   {user}       - the collection's resolved display name (a user's
  #                  users.preferences.<user>.display_name if set, else
  #                  their username capitalized)
  #   {media_type} - "Movie" or "TV"
  # Leave unset (or delete these two lines) to keep the default format
  # shown here - every install that doesn't set these sees no change.
  # An invalid template (unknown placeholder, bad {}) falls back to the
  # default and logs a warning rather than breaking a run.
  # Note: the multi-library disambiguation suffix (e.g. " (Movies 4K)")
  # is always appended after this template renders, regardless of what
  # it says - a custom template can't break that guarantee.
  movie_name_template: "🎬 {user} - Recommendation"
  tv_name_template: "📺 {user} - Recommendation"

  # When a movie_name_template/tv_name_template edit changes a user's
  # rendered collection name, RENAME the existing Plex collection to the
  # new name instead of leaving it behind as an orphan (the previous
  # collection's poster, sort title, added-at date and any manual
  # curation are preserved - a delete-and-recreate would lose all of
  # that). Identifies "the existing collection" via the same
  # PrivateCollection_<user> label Curatarr already applies to every
  # collection it manages, never by title guessing, so it will never
  # touch a collection it didn't create. Set to false to leave old-named
  # collections orphaned (the pre-existing behavior).
  rename_on_template_change: true

  # Per-user label restrictions - each user's library Browse/Search only
  # shows their own recommendation collection, not other users' (Plex
  # label restrictions; Library tab only, does not apply to Home).
  # NOT an access-control boundary: Plex enforces this exclusion on the
  # collection object, not on the items inside it, so a user who already
  # has (or guesses - ratingKeys are small sequential integers) a
  # collection's ratingKey can still retrieve its contents directly via
  # the Plex API. Treat this as UI-level separation, not privacy.
  # Note: Server admin always sees all collections (Plex limitation)
  private_collections: true

# =============================================================================
# EXTERNAL RECOMMENDATIONS
# =============================================================================
# Recommendations for content NOT in your Plex library
external_recommendations:
  enabled: true
  movie_limit: 50  # Per user
  show_limit: 20
  min_relevance_score: 0.65  # 0.0-1.0, minimum profile match to include in output
  auto_open_html: false  # Open watchlist in browser after generation
  # Discovery iteration settings
  min_votes: 50  # Minimum TMDB votes for reliability (filters garbage entries)
  max_iterations: 8  # Max discovery passes before giving up (more = slower but more thorough)
  # Language filter - only recommend content in this language (ISO 639-1 code)
  # Examples: "en" (English), "es" (Spanish), "ja" (Japanese), "ko" (Korean)
  # Set to null or omit to disable language filtering
  language: null

# =============================================================================
# RECENCY DECAY
# =============================================================================
# How much to weight recent watches vs older ones
recency_decay:
  enabled: true
  days_0_30: 1.0      # Full weight for last month
  days_31_90: 0.75    # 75% weight for 1-3 months ago
  days_91_180: 0.50   # 50% weight for 3-6 months ago
  days_181_365: 0.25  # 25% weight for 6-12 months ago
  days_365_plus: 0.10 # 10% weight for older than 1 year

# =============================================================================
# RATING MULTIPLIERS
# =============================================================================
# How much user ratings influence the profile (5-star scale)
rating_multipliers:
  star_5: 2.5  # Outstanding - strong signal
  star_4: 1.7  # Very good
  star_3: 1.0  # Neutral baseline
  star_2: 0.4  # Poor
  star_1: 0.2  # Very poor

# =============================================================================
# NEGATIVE SIGNALS
# =============================================================================
# Penalize content similar to disliked items
negative_signals:
  enabled: true

  # Low ratings create anti-preferences
  bad_ratings:
    enabled: true
    threshold: 3  # Plex 0-10 scale (3 = 1.5 stars)
    cap_penalty: 0.5  # Limit negative impact

  # Detect abandoned TV shows
  dropped_shows:
    enabled: true
    min_episodes_watched: 2  # Must watch N episodes to count
    max_completion_percent: 25  # Consider dropped if < 25% watched
    penalty_multiplier: -0.4

# =============================================================================
# PROFILE ACCURACY (#273)
# =============================================================================
# Advanced - off by default. When enabled, movie/tv preference profiles
# are built from MORE ACCURATE Plex data than the legacy default:
#   - Movie ratings are read from the Plex LIBRARY item (matches how TV
#     profiles already work) instead of Plex's watch-history API, which
#     never actually carries a user's star rating - so today, a movie
#     you've disliked NEVER produces a negative signal.
#   - Each configured user's own view count/rating is fetched through
#     THEIR OWN Plex account (switchUser) instead of always reading the
#     shared admin account's view - today, every user's rewatch/rating
#     weighting is silently computed from the ADMIN's own Plex state,
#     not their own.
# Off by default because enabling this changes existing users' actual
# recommendations (previously-invisible dislikes can now suppress
# similar content) and forces a one-time full profile rescore on the
# next run after you enable it (the profile hash changes) - a
# deliberate one-time cost, not a bug. See CHANGELOG for the full
# rationale and the real-library findings that motivated this.
profile_accuracy:
  enabled: false

# =============================================================================
# USER PREFERENCES
# =============================================================================
# Per-user settings (display_name, exclude_genres, max_rating)
# These override global settings for specific users
users:
  preferences:
    # testuser_alpha:
    #   display_name: Alpha
    #   # no max_rating = no filtering
    # testuser_charlie:
    #   display_name: Charlie
    #   max_rating: PG-13  # filters out R, NC-17
    # kid_account:
    #   display_name: Kid
    #   max_rating: PG  # only G and PG content
