# Curatarr Tuning Configuration
# Display options, weights, and scoring parameters
# This file is optional - defaults are used if not present

# =============================================================================
# MOVIE SETTINGS
# =============================================================================
movies:
  # Max recommendations per user - the final recommendation/collection
  # count (see general.limit_plex_results in config.example.yml for the
  # internal candidate-scoring buffer this feeds).
  limit_results: 50

  # Minimum similarity score (0.0-1.0) an item must reach to enter the
  # collection. The collection is allowed to come in UNDER limit_results
  # rather than pad itself with weak matches - if only 31 movies clear
  # the bar, you get 31 and a warning telling you the library is running
  # short of unwatched content matching that profile.
  #
  # Default 0.0 (disabled) preserves the historical behavior of always
  # filling to limit_results regardless of score. 0.20 is a reasonable
  # starting point; raise it until the tail of the collection stops
  # looking like filler. This is the library-side counterpart to
  # external_recommendations.min_relevance_score.
  min_similarity: 0.0

  # Calibrated recommendations (Steck, "Calibrated Recommendations",
  # RecSys 2018) - see utils/calibration.py.
  #
  # Ranking purely by score does not preserve your taste distribution:
  # whatever is abundant among the remaining unwatched candidates comes
  # to dominate the collection, however little of your actual viewing it
  # represents. A profile that is 4% family can easily produce a
  # collection that is 38% family once you have watched most of the
  # non-family library.
  #
  # Calibration instead matches the collection's genre mix to your watch
  # history's genre mix. It is NOT a genre exclusion: a genre you
  # genuinely watch still appears, at the rate you actually watch it and
  # represented by its highest-scoring titles.
  #
  # 0.0 = disabled (plain top-N by score, the historical behavior)
  # 0.5 = weight relevance and calibration equally (suggested start)
  # 1.0 = match the distribution as closely as possible, ignoring score
  calibration_strength: 0.0

  randomize_recommendations: false  # Randomize from top pool

  # Display options for recommendations output
  show_summary: true
  show_cast: true
  show_director: true
  show_genres: true
  show_language: true
  show_rating: true
  show_imdb_link: true

  # Quality filters - exclude low-quality content
  quality_filters:
    min_rating: 5.0  # TMDB rating minimum (0-10)
    min_vote_count: 15  # Minimum votes for reliability

  # Whether a user with ZERO watch history still gets a Recommended
  # collection built for them (#291). Default true: they get exactly
  # the same collection they always have, falling back to well-rated/
  # popular unwatched movies - cold start is a solved problem, and the
  # standard answer is a sensible fallback, not producing nothing (a
  # user who opens Plex and sees no collection concludes the app is
  # broken).
  #
  # Set to false to opt OUT of that instead: a zero-history user gets
  # no collection, and any collection curatarr already created for them
  # is actively REMOVED (only ever a collection curatarr can positively
  # confirm it created, via its own PrivateCollection_<user> label -
  # never guessed from title/name - and only for a user with zero
  # watch history; a user with ANY history is never touched).
  recommend_for_no_history: true

  # Scoring weights - must sum to 1.0
  weights:
    genre: 0.25
    director: 0.05
    actor: 0.20
    keyword: 0.50  # TMDB keywords (plot themes, settings)

# =============================================================================
# TV SHOW SETTINGS
# =============================================================================
tv:
  limit_results: 20  # Max recommendations per user
  min_similarity: 0.0  # See movies.min_similarity above
  calibration_strength: 0.0  # See movies.calibration_strength above
  randomize_recommendations: false
  normalize_counters: true  # Normalize across different show lengths

  # Display options
  show_summary: true
  show_cast: true
  show_language: true
  show_rating: true
  show_imdb_link: true

  # Quality filters
  quality_filters:
    min_rating: 0.0
    min_vote_count: 0

  # Whether a user with ZERO watch history still gets a Recommended
  # collection built for them - see movies.recommend_for_no_history
  # above for the full rationale (including the removal behavior when
  # set to false).
  recommend_for_no_history: true

  # Scoring weights - must sum to 1.0
  weights:
    genre: 0.25
    studio: 0.10  # TV uses studio instead of director
    actor: 0.20
    keyword: 0.45

# =============================================================================
# COLLECTION SETTINGS
# =============================================================================
collections:
  add_label: true  # Add 'Recommended' label to items
  label_name: Recommended
  append_usernames: true  # Include username in collection name

  # Custom collection-name templates (#267) - optional. Placeholders:
  #   {user}       - the collection's resolved display name (a user's
  #                  users.preferences.<user>.display_name if set, else
  #                  their username capitalized)
  #   {media_type} - "Movie" or "TV"
  # Leave unset (or delete these two lines) to keep the default format
  # shown here - every install that doesn't set these sees no change.
  # An invalid template (unknown placeholder, bad {}) falls back to the
  # default and logs a warning rather than breaking a run.
  # Note: the multi-library disambiguation suffix (e.g. " (Movies 4K)")
  # is always appended after this template renders, regardless of what
  # it says - a custom template can't break that guarantee.
  movie_name_template: "🎬 {user} - Recommendation"
  tv_name_template: "📺 {user} - Recommendation"

  # When a movie_name_template/tv_name_template edit changes a user's
  # rendered collection name, RENAME the existing Plex collection to the
  # new name instead of leaving it behind as an orphan (the previous
  # collection's poster, sort title, added-at date and any manual
  # curation are preserved - a delete-and-recreate would lose all of
  # that). Identifies "the existing collection" via the same
  # PrivateCollection_<user> label Curatarr already applies to every
  # collection it manages, never by title guessing, so it will never
  # touch a collection it didn't create. Set to false to leave old-named
  # collections orphaned (the pre-existing behavior).
  rename_on_template_change: true

  # Per-user label restrictions - each user's library Browse/Search only
  # shows their own recommendation collection, not other users' (Plex
  # label restrictions; Library tab only, does not apply to Home).
  # NOT an access-control boundary: Plex enforces this exclusion on the
  # collection object, not on the items inside it, so a user who already
  # has (or guesses - ratingKeys are small sequential integers) a
  # collection's ratingKey can still retrieve its contents directly via
  # the Plex API. Treat this as UI-level separation, not privacy.
  # Note: Server admin always sees all collections (Plex limitation)
  private_collections: true

# =============================================================================
# EXTERNAL RECOMMENDATIONS
# =============================================================================
# Recommendations for content NOT in your Plex library
external_recommendations:
  enabled: true
  movie_limit: 50  # Per user
  show_limit: 20
  min_relevance_score: 0.65  # 0.0-1.0, minimum profile match to include in output
  auto_open_html: false  # Open watchlist in browser after generation
  # Discovery iteration settings
  min_votes: 50  # Minimum TMDB votes for reliability (filters garbage entries)
  max_iterations: 8  # Max discovery passes before giving up (more = slower but more thorough)
  # Language filter - only recommend content in this language (ISO 639-1 code)
  # Examples: "en" (English), "es" (Spanish), "ja" (Japanese), "ko" (Korean)
  # Set to null or omit to disable language filtering
  language: null

# =============================================================================
# RECENCY DECAY
# =============================================================================
# How much to weight recent watches vs older ones
recency_decay:
  enabled: true
  days_0_30: 1.0      # Full weight for last month
  days_31_90: 0.75    # 75% weight for 1-3 months ago
  days_91_180: 0.50   # 50% weight for 3-6 months ago
  days_181_365: 0.25  # 25% weight for 6-12 months ago
  days_365_plus: 0.10 # 10% weight for older than 1 year

# =============================================================================
# RATING MULTIPLIERS
# =============================================================================
# How much user ratings influence the profile (5-star scale)
rating_multipliers:
  star_5: 2.5  # Outstanding - strong signal
  star_4: 1.7  # Very good
  star_3: 1.0  # Neutral baseline
  star_2: 0.4  # Poor
  star_1: 0.2  # Very poor

# =============================================================================
# NEGATIVE SIGNALS
# =============================================================================
# Penalize content similar to disliked items
negative_signals:
  enabled: true

  # Low ratings create anti-preferences
  bad_ratings:
    enabled: true
    threshold: 3  # Plex 0-10 scale (3 = 1.5 stars)
    cap_penalty: 0.5  # Limit negative impact

  # Detect abandoned TV shows
  dropped_shows:
    enabled: true
    min_episodes_watched: 2  # Must watch N episodes to count
    max_completion_percent: 25  # Consider dropped if < 25% watched
    penalty_multiplier: -0.4

  # Recommendations that were shown and never watched.
  #
  # The strongest signal a recommender gets is not what you watched - it
  # is what it put in front of you that you declined. A title that sat in
  # your collection for weeks unplayed is a far more direct "not for me"
  # than the mere absence of a play, which is ambiguous (never offered?
  # never noticed?). Without this, an item you keep passing over is
  # re-recommended with an identical score every single night.
  #
  # Penalties are split across an item's genres/keywords and floored, so
  # one skipped title barely registers but a consistent pattern does, and
  # no genre can be buried so deep the profile cannot recover from it.
  ignored_recommendations:
    enabled: true
    min_days_shown: 21  # Days on display before it counts as declined
    penalty: 0.5  # Total negative weight per ignored title

# =============================================================================
# PROFILE ACCURACY (#273)
# =============================================================================
# On by default since v2.10.82 - this is a defect fix, not a preference.
# When enabled, movie/tv preference profiles are built from MORE
# ACCURATE Plex data than the legacy (enabled: false) behavior:
#   - Movie ratings are read from the Plex LIBRARY item (matches how TV
#     profiles already work) instead of Plex's watch-history API, which
#     never actually carries a user's star rating - so with this off, a
#     movie you've disliked NEVER produces a negative signal.
#   - Each configured user's own view count/rating is fetched through
#     THEIR OWN Plex account (switchUser) instead of always reading the
#     shared admin account's view - with this off, every user's
#     rewatch/rating weighting is silently computed from the ADMIN's own
#     Plex state, not their own.
# Enabling/upgrading into this default changes existing users' actual
# recommendations (previously-invisible dislikes can now suppress
# similar content, and non-admin users' rewatch/rating weighting stops
# being computed from the admin's own Plex state) and forces a
# one-time full profile rescore on the next run
# after the flag flips (the profile hash changes) - a deliberate
# one-time cost, not a bug. Set enabled: false to keep the old
# (admin-contaminated) output unchanged for a release. See CHANGELOG
# for the full rationale and the real-library findings that motivated
# this, including measured top-10 recommendation overlap between old and
# new output.
profile_accuracy:
  enabled: true

# =============================================================================
# USER PREFERENCES
# =============================================================================
# Per-user settings (display_name, exclude_genres, max_rating)
# These override global settings for specific users
users:
  preferences:
    # testuser_alpha:
    #   display_name: Alpha
    #   # no max_rating = no filtering
    # testuser_charlie:
    #   display_name: Charlie
    #   max_rating: PG-13  # filters out R, NC-17
    # kid_account:
    #   display_name: Kid
    #   max_rating: PG  # only G and PG content
