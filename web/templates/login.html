<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Curatarr</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page-wrapper">
    <main>
      <h1>Curatarr</h1>
      <p>This instance is not bound to loopback and requires an access token.</p>
      {% if error %}
      <p class="banner error">Invalid token.</p>
      {% endif %}
      <form method="post" action="{{ url_for('login_submit') }}">
        <label>Access token
          <input type="password" name="token" autocomplete="current-password" required autofocus>
        </label>
        <button type="submit">Log in</button>
      </form>
    </main>
  </div>
</body>
</html>
