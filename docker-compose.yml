# Curatarr - Docker Compose template. See docs/DOCKER.md for full setup,
# scheduling, and troubleshooting instructions.
#
# Quick start:
#   mkdir -p config && ./setup.sh   # or: cp config/config.example.yml config/config.yml
#   # Uncomment CURATARR_AUTH_TOKEN below and set it to `openssl rand -hex 32`
#   # (or similar) - required, see that entry's comment for why.
#   docker compose up -d
#   open http://localhost:8787 and log in at /login with that token
#
# CURATARR_AUTH_TOKEN is required even for this loopback-only default:
# the container's process always binds 0.0.0.0 *inside* its own network
# namespace (see web/docker_server.py) regardless of how the port below
# is published, so it always fails closed at startup without one.

services:
  # Long-running web UI - dashboard, run-with-live-log, results, and
  # config screens. This is the main service; `docker compose up -d`
  # starts just this one.
  curatarr:
    image: ghcr.io/orchestratedchaos/curatarr:latest
    # build: .   # uncomment to build from source instead of the published image
    container_name: curatarr
    restart: unless-stopped
    ports:
      # Loopback-only by default, restricted on the HOST side - only
      # processes on this same machine can reach the published port,
      # same trust boundary as the native (non-Docker) app's own
      # 127.0.0.1-only bind. (The container's own process still listens
      # on 0.0.0.0 *inside* its network namespace either way - required
      # for Docker's bridge-network port publishing to reach it at all;
      # binding it to 127.0.0.1 internally would make it unreachable
      # through this port mapping entirely. That's also why
      # CURATARR_AUTH_TOKEN below is required even with this safe
      # default - the app can't tell, from inside the container, that
      # the host side is loopback-restricted.)
      - "127.0.0.1:8787:8787"
      # To reach it from another device on your LAN instead, publish on
      # all interfaces. See docs/DOCKER.md "Accessing from another
      # machine" - you'll also need CURATARR_ALLOWED_HOSTS below.
      # - "8787:8787"
    volumes:
      # config.yml/tuning.yml/trakt.yml/etc. - the one thing you need
      # to back up. Same host-side layout setup.sh already writes to.
      - ./config:/data/config
      # TMDB/Trakt metadata cache - large but fully rebuildable, so
      # it's a separate mount from config on purpose (nothing stops
      # you from skipping this one - cache then just lives under
      # ./config/cache inside the container instead, still persisted,
      # just not visible on the host as its own directory).
      - ./cache:/data/cache
      - ./logs:/data/logs
      - ./recommendations:/data/recommendations
    environment:
      - TZ=${TZ:-America/New_York}
      # Required - the container always binds 0.0.0.0 internally (see
      # the ports comment above), so web/docker_server.py refuses to
      # start without this set to a strong random value (at least 16
      # characters; generate one with `openssl rand -hex 32`). Keep it
      # secret, same as the Plex token/API keys under config/ - it
      # grants full access to this instance. The Host/Origin check
      # (CURATARR_ALLOWED_HOSTS below) is NOT authentication on its
      # own - it only stops browsers, not a script that sets those
      # headers itself. Log in once at /login with this value; the
      # browser carries it in a cookie afterward.
      # - CURATARR_AUTH_TOKEN=
      # Alternative to CURATARR_AUTH_TOKEN above, for an operator who has
      # decided this instance's published port is genuinely unreachable
      # by anything untrusted (e.g. nothing published to the host at
      # all, or a fully isolated network) and wants to run without a
      # token instead of generating one. Explicitly acknowledges the
      # instance will be UNAUTHENTICATED - anyone who CAN reach the port
      # gets full read/write access with no login. Prints a warning on
      # every boot as a reminder. Ignored (has no effect) if
      # CURATARR_AUTH_TOKEN above is also set - that always wins.
      # - CURATARR_TRUSTED_NETWORK=true
      # Set this to whatever host/LAN IP or hostname you actually
      # access the UI through if it's not localhost/127.0.0.1 (e.g.
      # behind a reverse proxy, or reached from another device on your
      # network) - unset means the UI only accepts requests whose Host
      # header is localhost/127.0.0.1, same as the native app. See
      # docs/DOCKER.md "Accessing from another machine".
      # - CURATARR_ALLOWED_HOSTS=192.168.1.50:8787

  # Optional: one-shot recommendation run, for scheduling instead of
  # (or in addition to) triggering runs from the web UI. Not started by
  # a plain `docker compose up` - only runs when explicitly targeted:
  #   docker compose run --rm curatarr-recommend
  # See docs/DOCKER.md "Scheduling" for a host-cron example that does
  # exactly this on a timer - the clean MVP for scheduled runs, so this
  # image doesn't need to bundle its own cron daemon.
  curatarr-recommend:
    image: ghcr.io/orchestratedchaos/curatarr:latest
    container_name: curatarr-recommend
    profiles: ["schedule"]
    volumes:
      - ./config:/data/config
      - ./cache:/data/cache
      - ./logs:/data/logs
      - ./recommendations:/data/recommendations
    environment:
      - TZ=${TZ:-America/New_York}
    command: ["recommend", "full"]
