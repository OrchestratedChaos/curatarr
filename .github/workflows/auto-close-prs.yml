name: Auto-close external PRs

on:
  pull_request:
    types: [opened]

# Least-privilege: this job only comments on and closes a PR - nothing
# else. issues:write is needed alongside pull-requests:write because
# createComment on a PR goes through the Issues API under the hood
# (every PR is also an issue in GitHub's API model).
permissions:
  pull-requests: write
  issues: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'OrchestratedChaos'
    steps:
      - name: Close PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thanks for the interest, but this project is not accepting external contributions. Feel free to fork it for your own use.'
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
