name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for every job below - neither needs to write
# anything back to the repo/PR. Jobs that need more (none do today)
# would declare their own, narrower `permissions:` block instead of
# widening this one.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock -r requirements-ui.lock -r requirements-docker.lock
          pip install pytest pytest-cov pip-audit

      - name: Audit locked dependencies for known vulnerabilities
        # Blocks the build on any finding - the lock files are exactly
        # what ships (source installs via run.sh/run-ui.sh, and the
        # Docker image), so a known-vulnerable pin here is a real,
        # actionable finding, not noise. build-requirements.lock
        # (PyInstaller, build-time only, never shipped to an end user)
        # is intentionally not included.
        run: pip-audit -r requirements.lock -r requirements-ui.lock -r requirements-docker.lock

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=85

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans only the commits introduced by this push/PR, not full history --
      # so this job can never go permanently red over something already on
      # main. The one-time full-history baseline scan is run manually (see
      # the secret-scanning rollout PR), not in CI.
      - name: Determine commit range
        id: range
        env:
          # Never interpolate ${{ github.event.* }} directly into a run:
          # body - all of it (branch names, SHAs) is attacker-influenced
          # on a pull_request event, and a crafted value could otherwise
          # break out of the shell command it's spliced into. Passed
          # through env + referenced as shell vars instead, same
          # discipline release.yml's own steps already use.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$PR_BASE_REF" --depth=1
            echo "range=origin/${PR_BASE_REF}..HEAD" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "range=HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "range=${EVENT_BEFORE}..${EVENT_AFTER}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run gitleaks
        run: |
          gitleaks detect --source . \
            --log-opts="${{ steps.range.outputs.range }}" \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1
